http 
{
	server
	{
		listen 8080;
		erver_name 127.0.0.1;
		error_page 404 /404.html;
		error_page 500 /500.html;
		client_max_body_size 10M;
		location /images.html {
			root /var/www/html/;
			index index.html index.htm;
			allow_methods GET POST;
		}

		location /redirect {
			return 301 http://hello.com
		}
	}
}