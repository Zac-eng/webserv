http 
{
    server {
        listen 80;
        listen 79;
        server_name "example.com";
        error_page 404 /404.html;
        error_page 500 /500.html;
        location /images.html {
            root /var/www/html/;
            index index.html index.htm;
            allow_methods GET POST;
		}
		location /images.htm {
            root /var/www/html;
            index index.html index.htm;
            allow_methods GET POST;
        }

     }


